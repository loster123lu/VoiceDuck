name: 功能建议
description: 提议新的使用场景或改进方式
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望 VoiceDuck 如何表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方法
      description: 现在是如何解决或绕过的？
